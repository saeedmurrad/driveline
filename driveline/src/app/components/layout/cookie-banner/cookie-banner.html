@if (isVisible()) {
  <div
    class="fixed bottom-0 left-0 right-0 z-50 px-3 pt-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:px-4 sm:pt-4 animate-slide-up"
    role="region"
    aria-label="Cookies"
  >
    <!-- Compact on phones: one short line of text and the OK button side by side -->
    <div class="max-w-4xl mx-auto bg-white ring-1 ring-stone-200 dark:bg-slate-800 dark:ring-slate-700 rounded-2xl shadow-2xl p-3 sm:p-5 flex flex-row items-center gap-3 sm:gap-4">
      <div class="hidden sm:flex w-10 h-10 bg-rose-50 dark:bg-rose-950/50 rounded-xl items-center justify-center flex-shrink-0" aria-hidden="true">
        <svg class="w-5 h-5 text-rose-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <p class="flex-1 min-w-0 text-xs sm:text-sm text-gray-700 dark:text-slate-200 leading-snug sm:leading-relaxed">
        No tracking or advertising cookies.<span class="hidden sm:inline"> We only keep a few settings in your browser, like saved cars and dark mode.</span> <a routerLink="/legal/cookie-policy" class="ml-1 text-rose-700 dark:text-rose-300 underline-offset-2 hover:underline font-medium">Cookie Policy</a>
      </p>
      <button
        type="button"
        (click)="accept()"
        class="flex-shrink-0 min-h-11 px-5 sm:px-6 text-sm font-semibold text-white bg-rose-700 hover:bg-rose-800 rounded-xl transition-colors duration-200"
      >
        OK
      </button>
    </div>
  </div>
}
