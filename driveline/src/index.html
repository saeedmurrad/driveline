<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    try {
      if (localStorage.getItem('darkMode') === 'true') {
        document.documentElement.classList.add('dark');
      }
    } catch (_) {}
  </script>
  <title>Dealer Website</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Quality used cars and vans. Browse stock, finance, warranty and contact your local dealer.">
  <link rel="canonical" href="/">
  <!-- Browser chrome: neutral in light mode; dark UI when .dark is set is handled by page styling -->
  <meta name="theme-color" content="#2563eb">
  <!-- Tab icon: same car mark as header logo (SVG only — no missing .ico/.png 404s) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <!-- Open Graph / Twitter: absolute URLs required for link previews (update SITE_URL if you change host) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dealer Website">
  <meta property="og:title" content="Quality Used Cars & Vans">
  <meta property="og:description" content="Quality, affordable used cars, vans and 4x4s. Safety inspected, warranty and finance available.">
  <meta property="og:url" content="/">
  <meta property="og:image" content="/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Used cars and vans">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Quality Used Cars & Vans">
  <meta name="twitter:description" content="Quality, affordable used cars, vans and 4x4s.">
  <meta name="twitter:image" content="/og-image.svg">
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

</body>
</html>
