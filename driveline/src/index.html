<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    try {
      if (localStorage.getItem('darkMode') === 'true') {
        document.documentElement.classList.add('dark');
      }
      // Site theme (ThemeService): apply before first paint so the page never flashes the other look
      if (localStorage.getItem('dlTheme') === 'prestige') {
        document.documentElement.setAttribute('data-theme', 'prestige');
        var f = document.createElement('link');
        f.id = 'dl-prestige-fonts';
        f.rel = 'stylesheet';
        f.href = 'https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap';
        document.head.appendChild(f);
      }
    } catch (_) {}
    // Installable app: keep the browser's install offer for our own "Install the app" button
    // (PwaService), and keep its pop-up bar from covering the bars at the bottom of the page.
    addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__dlInstallEvent = e;
    });
  </script>
  <title>DriveLine | Used Cars &amp; Vans in Peterborough</title>
  <base href="/">

  <!-- Browser chrome: neutral in light mode; dark UI when .dark is set is handled by page styling -->
  <meta name="theme-color" content="#f43f5e">

  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <!-- Installable app (PWA): opens in its own window from the home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="DriveLine">
  <meta name="apple-mobile-web-app-title" content="DriveLine">
