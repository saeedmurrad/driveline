@if (isVisible()) {
  <div
    class="fixed bottom-0 left-0 right-0 z-50 px-4 pt-4 pb-[max(1rem,env(safe-area-inset-bottom))] animate-slide-up"
    role="region"
    aria-label="Cookies"
  >
    <div class="max-w-4xl mx-auto glass-warm dark:bg-slate-800 rounded-2xl shadow-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center gap-4">
      <div class="w-10 h-10 bg-rose-50 dark:bg-rose-950/50 rounded-xl flex items-center justify-center flex-shrink-0" aria-hidden="true">
        <svg class="w-5 h-5 text-rose-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <div class="flex-1">
        <p class="text-sm text-gray-700 dark:text-slate-200 leading-relaxed">
          No tracking or advertising cookies here. We only keep a few settings in your browser, like saved cars and dark mode.
          <a routerLink="/legal/cookie-policy" class="text-rose-700 hover:underline font-medium">Read our Cookie Policy</a>
        </p>
      </div>
      <div class="flex items-center gap-3 flex-shrink-0">
        <button
          type="button"
          (click)="accept()"
          class="px-6 py-2 text-sm font-semibold text-white bg-rose-700 hover:bg-rose-800 rounded-lg transition-colors duration-200"
        >
          OK
        </button>
      </div>
    </div>
  </div>
}
