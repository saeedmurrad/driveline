# Firebase App Hosting — DriveLine / DivineBytes SSR + platform API
runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 10
  concurrency: 80

scripts:
  buildCommand: npm run build
  runCommand: node dist/driveline/server/server.mjs

outputFiles:
  serverApp:
    include:
      - dist
      - platform

env:
  - variable: DEFAULT_DEALER_SLUG
    value: driveline
    availability:
      - RUNTIME
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: NG_ALLOWED_HOSTS
    value: drivelinecarsales.co.uk,www.drivelinecarsales.co.uk,*.hosted.app,*.run.app
    availability:
      - RUNTIME
  # After: npx firebase apphosting:secrets:set DVLA_API_KEY
  # - variable: DVLA_API_KEY
  #   secret: DVLA_API_KEY
